<div id="st"><h1>मेरा गाँव</h1><p>यादों वाला गाँव — शाम की सुनहरी धूप, रेडियो पर पुराने नग़मे, बरगद के नीचे बुज़ुर्गों की चौपाल। हेडफ़ोन लगाइए, आवाज़ पास जाने पर तेज़ होती है।</p><button id="go">▶ गाँव में चलिए</button></div>

<script>
const $=i=>document.getElementById(i),T=THREE,PI=Math.PI,rn=(a,b)=>a+Math.random()*(b-a),wx=x=>x-120,wz=y=>y-95;
const ren=new T.WebGLRenderer({canvas:$('c'),antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;

function rs(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}onresize=rs;rs();
// ---- बनावट (textures)
function tex(f,rep){const c=document.createElement('canvas');c.width=c.height=128;f(c.getContext('2d'));const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=4;return t}
const spk=(x,cols,n,s)=>{for(let i=0;i<n;i++){x.fillStyle=cols[i%cols.length];x.fillRect(Math.random()*128,Math.random()*128,s,s)}};
const tGrass=tex(x=>{x.fillStyle='#5d9a3c';x.fillRect(0,0,128,128);spk(x,['#4f8a33','#6cab47','#7bb852','#477d2e'],900,2)},70);
const tDirt=tex(x=>{x.fillStyle='#a58a5e';x.fillRect(0,0,128,128);spk(x,['#8f7550','#b79c70','#7d6644'],700,2)},8);
const tWall=tex(x=>{x.fillStyle='#fff';x.fillRect(0,0,128,128);spk(x,['#e9e2d2','#f4efe3','#d9d0bc'],900,3)},2);
const tTile=tex(x=>{x.fillStyle='#a8452c';x.fillRect(0,0,128,128);x.strokeStyle='#6e2a1a';x.lineWidth=3;for(let i=0;i<128;i+=16){x.beginPath();x.moveTo(0,i);x.lineTo(128,i);x.stroke()}},3);
const tWater=tex(x=>{x.fillStyle='#2f7fb8';x.fillRect(0,0,128,128);x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;for(let i=0;i<14;i++){const y=rn(0,128),a=rn(0,128);x.beginPath();x.moveTo(a,y);x.lineTo(a+30,y);x.stroke()}},1);tWater.repeat.set(30,2);
const M={},mat=(c,m,r=.9)=>M[c+(m?m.uuid:'')]||(M[c+(m?m.uuid:'')]=new T.MeshStandardMaterial({color:c,map:m||null,roughness:r}));
const mesh=(geo,mt,x,y,z,p)=>{const m=new T.Mesh(geo,mt);m.castShadow=m.receiveShadow=true;m.position.set(x,y,z);(p||sc).add(m);return m};
const col=[],cir=[];
function B(x,y,w,d,h,c,m,solid=1){if(solid)col.push([wx(x),wz(y),w,d]);return mesh(new T.BoxGeometry(w,h,d),mat(c,m),wx(x+w/2),h/2,wz(y+d/2))}
function flat(w,d,x,z,mt,y=.03){const m=new T.Mesh(new T.PlaneGeometry(w,d),mt);m.rotation.x=-PI/2;m.position.set(x,y,z);m.receiveShadow=true;sc.add(m);return m}

flat(36,21,wx(188),wz(52.5),new T.MeshStandardMaterial({color:'#d8c58a',roughness:1}),.04);

flat(300,10,0,wz(135),wm,.08);flat(300,1.6,0,wz(129.2),dirtM,.05);flat(300,1.6,0,wz(140.8),dirtM,.05);

for(const s of[-1,1])mesh(new T.BoxGeometry(.2,.9,12),mat('#6b4423'),8+s*4.3,.5,40);
// ---- आसमान और रोशनी
const sky=new T.Mesh(new T.SphereGeometry(400,24,12),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{t:{value:new T.Color()},b:{value:new T.Color()}},vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform vec3 t,b;varying vec3 p;void main(){gl_FragColor=vec4(mix(b,t,smoothstep(0.,.55,normalize(p).y)),1.);}'}));sc.add(sky);
const hemi=new T.HemisphereLight('#bbccdd','#6a5a3a',.6),sun=new T.DirectionalLight('#ffb066',1.8),sd=new T.Vector3();

const lampM=new T.MeshStandardMaterial({color:'#ffe9a8',emissive:'#ffcc55',emissiveIntensity:.5});
const PS=[{n:'सुबह',t:'#6fa8dc',b:'#fbe3c0',f:'#f3d9b6',s:'#ffd9a0',si:1.6,hi:.7,d:[-.8,.4,.5],l:0},{n:'शाम',t:'#3a5a96',b:'#f6a561',f:'#e9a46e',s:'#ff9d57',si:1.9,hi:.55,d:[.8,.22,-.4],l:.6},{n:'रात',t:'#050a1c',b:'#1d2a4a',f:'#10182e',s:'#8fa8e0',si:.45,hi:.3,d:[.3,.7,.3],l:2.5}];
let ti=1;
// ---- इंसान
function human(sh_,pa,o={}){const g=new T.Group(),skn=mat(o.sk||'#a9744a');
 const add=(geo,mt,x,y,z,p)=>{const m=new T.Mesh(geo,mt);m.position.set(x,y,z);(p||g).add(m);return m};
 add(new T.CylinderGeometry(.26,.3,.75,10),mat(sh_),0,1.3,0);
 if(o.f)add(new T.CylinderGeometry(.3,.5,.95,10),mat(pa),0,.55,0);
 add(new T.SphereGeometry(.21,12,10),skn,0,1.88,0);
 add(o.tb?new T.SphereGeometry(.25,10,8):new T.SphereGeometry(.22,10,6,0,PI*2,0,PI/2),mat(o.cp||'#222'),0,o.tb?1.97:1.92,0);
 for(const s of[-1,1])add(new T.SphereGeometry(.03,6,6),mat('#111'),s*.08,1.9,.19);
 if(o.bd)add(new T.SphereGeometry(.14,8,8),mat('#f2f2f2'),0,1.76,.1);
 const lg=[],ar=[];
 for(const s of[-1,1]){const l=new T.Group();l.position.set(s*.13,.9,0);g.add(l);if(!o.f)add(new T.CylinderGeometry(.1,.09,.9,8),mat(pa),0,-.45,0,l);add(new T.SphereGeometry(.1,6,6),skn,0,-.88,.04,l);lg.push(l);
  const a=new T.Group();a.position.set(s*.36,1.6,0);g.add(a);add(new T.CylinderGeometry(.07,.07,.6,6),mat(sh_),0,-.3,0,a);add(new T.SphereGeometry(.07,6,6),skn,0,-.62,0,a);ar.push(a)}
 g.userData={lg,ar};g.scale.setScalar(o.s||1);g.traverse(m=>m.castShadow=true);return g}
function cow(c='#f1e8d8',s=1){const g=new T.Group(),add=(geo,mt,x,y,z)=>{const m=new T.Mesh(geo,mt);m.position.set(x,y,z);m.castShadow=true;g.add(m)};
 add(new T.BoxGeometry(.8,.8,1.8),mat(c),0,1.1,0);add(new T.BoxGeometry(.4,.45,.5),mat(c),0,1.35,1.1);add(new T.BoxGeometry(.3,.2,.2),mat('#d9a7a0'),0,1.22,1.4);add(new T.BoxGeometry(.82,.4,.6),mat('#6b4a2e'),0,1.25,-.2);
 for(const[x,z]of[[-.28,.7],[.28,.7],[-.28,-.7],[.28,-.7]])add(new T.BoxGeometry(.18,.8,.18),mat(c),x,.4,z);
 for(const x of[-.15,.15])add(new T.ConeGeometry(.05,.25,5),mat('#ddd'),x,1.65,1.05);g.scale.setScalar(s);return g}
function hen(){const g=new T.Group(),add=(geo,mt,x,y,z)=>{const m=new T.Mesh(geo,mt);m.position.set(x,y,z);g.add(m)};add(new T.BoxGeometry(.25,.25,.4),mat('#b5651d'),0,.3,0);add(new T.SphereGeometry(.09,6,6),mat('#b5651d'),0,.5,.2);add(new T.BoxGeometry(.03,.07,.1),mat('#d22'),0,.6,.2);return g}
const NP=[];function npc(g,x,z,r,sp=1.1){g.position.set(x,0,z);sc.add(g);NP.push({g,hx:x,hz:z,r,sp,tx:x,tz:z,w:0,ph:rn(0,6)})}

 const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),depthWrite:false,fog:false}));s.scale.set(8,2,1);s.position.set(x,y,z);sc.add(s);return s}

const spots=[];

function lamp(x,y){const X=wx(x),Z=wz(y);mesh(new T.CylinderGeometry(.08,.1,4.5,6),mat('#333'),X,2.25,Z);mesh(new T.SphereGeometry(.3,8,8),lampM,X,4.6,Z).castShadow=false}
function house(x,y,w,d,c,f=1){B(x,y,w,d,3.2,c,tWall);const r=new T.Mesh(new T.ConeGeometry(.85*w,2.2,4),mat('#a8452c',tTile));r.geometry.rotateY(PI/4);r.scale.z=d/w;r.position.set(wx(x+w/2),4.3,wz(y+d/2));r.castShadow=true;sc.add(r);
 const z=f>0?wz(y+d)+.06:wz(y)-.06;mesh(new T.BoxGeometry(1,2,.1),mat('#5a3a22'),wx(x+w/2),1,z);mesh(new T.BoxGeometry(1.2,.9,.1),mat('#3b4a5a'),wx(x+w*.2),2,z);mesh(new T.BoxGeometry(1.2,.9,.1),mat('#3b4a5a'),wx(x+w*.8),2,z);
